# -------------------------------
# Environment settings
# -------------------------------
num_envs: 16                  # Number of parallel environments
num_frames: 5                 # Number of frames stacked as input
channels_per_frame: 3         # RGB channels per frame
input_shape_2d: [96, 96]   # HxW input size
n_actions: 5                  # Number of discrete actions

# -------------------------------
# PPO Hyperparameters
# -------------------------------
max_frames: 10_000_000          # Total environment steps
update_timesteps: 4096        # Steps per PPO update (rollout length)
ppo_epochs: 4                 # Number of PPO epochs per update
mini_batch_size: 256           # Mini-batch size for optimization
gamma: 0.99                   # Discount factor
gae_lambda: 0.95              # Lambda for GAE
clip_coef: 0.2                # PPO clipping coefficient
ent_coef: 0.01                # Entropy bonus coefficient
vf_coef: 0.5                  # Value loss coefficient
max_grad_norm: 0.5            # Gradient clipping
learning_rate: 3e-4           # Adam learning rate
frame_skip: 1                  # Frames to skip per action
max_steps_per_episode: 1000    # Max steps before episode ends

# -------------------------------
# Curriculum / Environment scaling
# -------------------------------
num_asteroids: 5
max_asteroid_size: 90
min_asteroid_size: 30
max_asteroid_speed_start: 0.5
max_asteroid_speed_end: 2.5
max_asteroid_speed_ramp: 1_000_000
death_reward: -1.0
asteroid_destroyed_reward_scalar: 1.0

# -------------------------------
# Logging / saving
# -------------------------------
save_interval: 500_000
eval_interval: 200_000
google_drive_backup: true
eval_episodes: 5