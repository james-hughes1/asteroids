# config/train_config.yaml

num_frames: 4
channels_per_frame: 3
input_shape_2d: [128, 128]
n_actions: 5

max_frames: 10_000_000
frame_idx_start: 0
max_steps_per_episode: 400
max_asteroid_size: 120
min_asteroid_size: 120
num_asteroids: 1
max_asteroid_speed_start: 2.0
max_asteroid_speed_end: 2.0
max_asteroid_speed_ramp: 2_000_000

death_reward: -1.0
asteroid_destroyed_reward_scalar: 1.0

gamma: 0.99

epsilon_start: 1.0
epsilon_final: 0.05
epsilon_decay: 1_000_000

batch_size: 64
learning_rate_start: 0.0001
learning_rate_decay: 0.8
learning_rate_interval: 2_000_000

replay_capacity: 100_000
target_update_interval: 20_000
save_interval: 1_000_000
log_interval: 10_000
eval_interval: 100_000
frame_skip: 4
frame_skip_deactivate: 1_000_000

alpha: 0.6
beta_start: 0.4

num_envs: 16

eval_episodes: 10
init_model_path: ""

google_drive_backup: true